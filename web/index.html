<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스마트팜 관제</title>
<style>body{font:16px system-ui;background:#edf5ef;color:#163d2c;max-width:960px;margin:auto;padding:20px}article,form{background:white;border-radius:16px;padding:24px;margin:16px 0}button,input{font:inherit;padding:12px;margin:5px;border:1px solid #8baf9a;border-radius:8px}button{background:#176347;color:white;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}strong{font-size:26px}#message{white-space:pre-wrap}pre{overflow:auto}</style>
<h1>🌱 스마트팜 관제</h1><p>ESP32 · Modbus TCP · UNO × 2</p>
<form id="login"><input id="username" placeholder="아이디" autocomplete="username" required><input id="password" type="password" placeholder="비밀번호" autocomplete="current-password" required><button>로그인</button></form>
<p id="message" role="status"></p><div id="dashboard" hidden><p id="mode"></p><div id="nodes" class="grid"></div><article><h2>관개 제어 · UNO 2</h2><p>펌프는 1회 최대 10초. 자동관개는 수분 회복 후 재급수합니다.</p><button onclick="control(2,4,1)">10초 급수</button><button onclick="control(2,4,0)">펌프 정지</button><button onclick="control(2,7,1)">자동관개 켜기</button><button onclick="control(2,7,0)">자동관개 끄기</button><button onclick="control(2,5,1)">부저 켜기</button><button onclick="control(2,5,0)">부저 끄기</button><p><label>수분 기준(%) <input id="threshold" type="number" min="0" max="100" value="30"></label><button onclick="control(2,6,Number(document.getElementById('threshold').value))">기준 적용</button></p></article><button onclick="history()">최근 기록 100건</button><pre id="history"></pre></div>
<script>
const el=id=>document.getElementById(id);
async function api(path,data){let r=await fetch('/api/'+path,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});let j=await r.json();if(!r.ok)throw Error(j.error);return j}
el('login').onsubmit=async e=>{e.preventDefault();try{await api('login',{username:el('username').value,password:el('password').value});el('password').value='';el('login').hidden=true;el('dashboard').hidden=false;await refresh()}catch(e){el('message').textContent=e.message}};
async function refresh(){try{let s=await api('state');el('mode').textContent=s.mode==='demo'?'시뮬레이션 · 실제 장치와 연결되지 않았습니다':'실제 장치 모드';el('nodes').innerHTML='';for(let n of s.nodes){let a=document.createElement('article'),r=n.registers;a.innerHTML=`<h2>UNO ${n.unit}</h2><strong>${n.online?(n.unit===2?r[1]+'%':'입출력 노드'):'연결 끊김'}</strong><p>${n.online?'ADC '+r[0]+' · 버튼 '+r[2]+' · LED '+r[3]:'전원·배선·통신 점검'}</p>${n.unit===2&&n.online?'<p>펌프 '+(r[4]?'가동':'정지')+' · 자동 '+(r[7]?'ON':'OFF')+'</p>':''}`;for(let mask of [0,1,2,3]){let b=document.createElement('button');b.textContent='LED '+mask;b.disabled=!n.online;b.onclick=()=>control(n.unit,3,mask);a.append(b)}el('nodes').append(a)}}catch(e){el('message').textContent=e.message;el('nodes').textContent='조회 실패 · 장치 상태를 확인할 수 없습니다'}}
async function control(unit,address,value){try{let r=await api('control',{unit,address,value});el('message').textContent=r.message;await refresh()}catch(e){el('message').textContent=e.message}}
async function history(){try{el('history').textContent=JSON.stringify(await api('history'),null,2)}catch(e){el('message').textContent=e.message}}
setInterval(()=>{if(!el('dashboard').hidden)refresh()},3000);
</script></html>
